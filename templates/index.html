  <body>
    <canvas id="shader"></canvas>

    <main>
      <h1>shaderland</h1>
      <h2>a creative-programming puzzle game</h2>
      <article>
        <section>
          <p>// wire up <b>nodes</b></p>
          <p>// create a world of <b>pixels</b></p>
          <p>// guide polygonal <b>creatures</b></p>

        <section>
          <p>// follow <b>l1l1th</b></p>
          <p>// a <b>hacker</b> // your <b>friend</b> // gone</p>

            // what <b><em>happened</em></b> to her?
          </p>
          <div>
            <p>// the <b>ferret</b> will find out...</p>
            <p class="right">...won't she?</p>
          </div>
        </section>
      </article>
      <a
        class="steam"
        href="https://store.steampowered.com/app/4487340/Shaderland/"
